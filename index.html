<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lila Tim</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;1,400;1,500&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
      background-color: #F2F2F2;
    }

    /* Encabezado fijo */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 14px 24px;
      box-sizing: border-box;
      font-family: 'Alegreya Sans', sans-serif;
      font-weight: 500;
      font-size: 18px;
      background-color: rgba(242, 242, 242, 0.95);
    }

    .brand {
      color: #00FF00;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    nav {
      display: flex;
      gap: 16px;
    }

    nav a {
      color: #00FF00;
      text-decoration: none;
      text-transform: lowercase;
      transition: opacity 0.2s ease;
    }

    nav a:hover, .brand:hover {
      opacity: 0.7;
    }

    /* Sección GIF principal */
    .hero-section {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
    }

    .hero-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Sección Bio */
    .bio-section {
      background-color: #F2F2F2;
      padding: 25px 40px 30px 40px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }

    .bio-container {
      width: 100%;
      max-width: 100%;
    }

    .separator-line {
      border: none;
      border-top: 1.5px solid #00FF00;
      margin-top: 0;
      margin-bottom: 25px;
      width: 100%;
    }

    .bio-text {
      font-family: 'Alegreya Sans', sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #000000;
      line-height: 1.6;
      text-align: left;
    }

    .bio-text p {
      margin-bottom: 22px;
    }

    .bio-text a {
      color: #C0262D;
      text-decoration: underline;
      transition: color 0.2s ease;
    }

    .bio-text a:hover {
      color: #00FF00;
    }

    /* Imagen divisora */
    .divider-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      object-fit: cover;
    }

    /* Sección Archivo */
    .archive-section {
      position: relative;
      overflow: hidden;
      background-color: #F2F2F2;
      padding: 35px 40px 80px 40px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }

    .archive-container {
      width: 100%;
      max-width: 100%;
      position: relative;
      z-index: 2;
      text-align: left;
    }

    /* Categoría desplegable */
    .archive-category {
      margin-top: 30px;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
      width: fit-content;
    }

    .category-title {
      font-family: 'Alegreya Sans', sans-serif;
      font-style: italic;
      font-weight: 500;
      font-size: 24px;
      color: #B30033;
      text-decoration: underline;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* Ícono estilo MS Outlook */
    .outlook-icon {
      display: inline-block;
      width: 20px;
      height: 14px;
      border: 2px solid #B30033;
      position: relative;
      background-color: transparent;
      box-sizing: border-box;
    }

    .outlook-icon::before {
      content: '';
      position: absolute;
      top: 1px;
      left: 2px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #B30033;
      transform: rotate(-90deg);
      transition: transform 0.2s ease;
    }

    .archive-category.active .outlook-icon::before {
      transform: rotate(0deg);
    }

    /* Grilla de subproyectos */
    .subproject-grid {
      display: none;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0 !important;
      margin: 10px 0 35px 0;
      padding: 0;
      width: 100%;
    }

    .subproject-grid.active {
      display: flex;
    }

    /* Tarjetas de enlace */
    .subproject-card {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 0 !important;
      text-decoration: none;
      box-sizing: border-box;
      max-width: 100%;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .subproject-card:hover {
      transform: translateY(-3px);
      opacity: 0.95;
    }

    .subproject-title-header {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .paperclip-icon {
      width: 18px;
      height: 18px;
      min-width: 18px;
      margin-top: 2px;
      color: #B30033;
      transition: color 0.2s ease;
    }

    .subproject-name {
      font-family: 'Alegreya Sans', sans-serif;
      font-style: italic;
      font-weight: 500;
      font-size: 18px;
      color: #B30033;
      text-transform: uppercase;
      line-height: 1.25;
      word-break: break-word;
      transition: color 0.2s ease;
    }

    .subproject-card:hover .subproject-name,
    .subproject-card:hover .paperclip-icon {
      color: #00FF00;
    }

    /* Foto del subproyecto sin borde redondo */
    .subproject-photo {
      height: 243px;
      width: auto;
      max-width: 100%;
      border-radius: 0 !important;
      border: none !important;
      outline: none !important;
      display: block;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Tarjeta con video miniatura en proporción Reel (9:16) */
    .video-card {
      position: relative;
      height: 243px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background-color: #000;
    }

    .subproject-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 315%;
      height: 115%;
      transform: translate(-50%, -50%);
      border: none;
      display: block;
      pointer-events: none;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      cursor: pointer;
    }

    /* Figuras geométricas flotantes */
    .geo-shape {
      position: absolute;
      top: 0;
      left: 0;
      border: 1.5px solid #00FF00;
      background: rgba(0, 255, 0, 0.08);
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
      pointer-events: none;
      z-index: 1;
      will-change: transform, width, height, border-radius;
      transition: width 0.35s cubic-bezier(0.25, 1, 0.5, 1), 
                  height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Video grande al final de la página */
    .footer-video-section {
      width: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .footer-video-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
    }

    .footer-video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      header {
        padding: 12px 16px !important;
        font-size: 16px !important;
      }

      .bio-section {
        padding: 20px 16px 25px 16px !important;
      }

      .bio-text {
        font-size: 16px !important;
      }

      .archive-section {
        padding: 25px 16px 60px 16px !important;
      }

      /* Fila horizontal sin recortes ni saltos */
      .subproject-grid {
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        justify-content: flex-start !important;
        overflow-x: auto !important;
        gap: 4px !important;
